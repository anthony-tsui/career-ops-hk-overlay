  - name: HSBC
    careers_url: https://apply.careers.hsbc.com
    scan_method: websearch
    scan_query: 'site:apply.careers.hsbc.com Hong Kong "AI transformation" OR solutions OR delivery OR "digital transformation" OR analytics OR MarTech'
    notes: "Hang Seng applications also live on this portal. In-house preferred."
    enabled: true

  - name: Hang Seng
