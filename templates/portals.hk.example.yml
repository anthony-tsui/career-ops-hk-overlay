job_boards:
  - name: JobsDB HK — AI transformation & digital
    provider: jobstreet
    api: https://hk.jobsdb.com/api/jobsearch/v5/search
    siteKey: HK-Main
    searchKeywords: '"AI transformation" OR "digital transformation" OR "transformation lead"'
    searchLocation: "Hong Kong"
    pageSize: 30
    maxPages: 3
    enabled: true
    notes: "SEEK v5 public API. Zero login. HK location_filter applies."

  - name: JobsDB HK — solutions & delivery
    provider: jobstreet
    api: https://hk.jobsdb.com/api/jobsearch/v5/search
    siteKey: HK-Main
    searchKeywords: 'solutions OR "delivery manager" OR "delivery lead" OR "programme delivery"'
    searchLocation: "Hong Kong"
    pageSize: 30
    maxPages: 3
    enabled: true

  - name: JobsDB HK — customer AI & GenAI
    provider: jobstreet
    api: https://hk.jobsdb.com/api/jobsearch/v5/search
    siteKey: HK-Main
    searchKeywords: '"customer AI" OR GenAI OR "artificial intelligence"'
    searchLocation: "Hong Kong"
    pageSize: 30
    maxPages: 3
    enabled: true

  - name: JobsDB HK — MarTech (secondary)
    provider: jobstreet
    api: https://hk.jobsdb.com/api/jobsearch/v5/search
    siteKey: HK-Main
    searchKeywords: "MarTech OR CDP OR tagging OR Tealium"
    searchLocation: "Hong Kong"
    pageSize: 30
    maxPages: 3
    enabled: true

  - name: JobsDB HK — measurement (secondary)
    provider: jobstreet
    api: https://hk.jobsdb.com/api/jobsearch/v5/search
    siteKey: HK-Main
    searchKeywords: "marketing measurement OR MMM OR mix modelling OR analytics"
    searchLocation: "Hong Kong"
    pageSize: 30
    maxPages: 3
    enabled: true

  - name: JobsDB HK — data analytics (secondary)
    provider: jobstreet
    api: https://hk.jobsdb.com/api/jobsearch/v5/search
    siteKey: HK-Main
    searchKeywords: "data analytics OR marketing analytics"
    searchLocation: "Hong Kong"
    pageSize: 30
    maxPages: 3
    enabled: true
    notes: "Broad lane. Title filter and your salary_filter.min still apply. JobsDB totals miss some career-page seats."
