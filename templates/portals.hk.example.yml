# Example Hong Kong portal seed for a career-ops HK/APAC overlay.
# Copy to portals.yml in your career-ops checkout (that file stays gitignored).
# Replace YOUR_FLOOR_HKD_YEAR and YOUR_TARGET_HKD_YEAR with your own annual HKD figures.
# Do not HTTP-scrape LinkedIn or eFinancialCareers. eCareer HK is a paste-only seed.

# Employment preference — Slice D (scan + eval gates; contract/temp → Review, never silent drop).
employment_filter:
  enabled: true
  prefer: permanent_ft

# Agency / Big4 — demote to Review unless JD/title shows clear AI signals (portals stay enabled).
agency_filter:
  enabled: true
  demote_unless_ai: true
  big4:
    # Matcher uses token/phrase aliases in lib/hk-scan-filters.mjs (EY → Ernst & Young / EY token; PwC → PricewaterhouseCoopers / PwC / Price Waterhouse).
    - Deloitte
    - PwC
    - EY
    - KPMG
  agency_companies:
    - Michael Page
    - Hays
    - Robert Walters
    - Morgan McKinley
    - Randstad
    - Ambition
    - Oliver James
  ai_signals:
    - "AI transformation"
    - "digital transformation"
    - GenAI
    - "customer AI"
    - "solutions architect"
    - "solutions delivery"
    - "delivery lead"
    - "transformation lead"
    - "word:AI"

# -- Location: Hong Kong only (always_allow still catches HK variants in titles) --
location_filter:
  always_allow:
    - "Hong Kong"
    - "HK"
    - "Kowloon"
    - "Hong Kong SAR"
  allow:
    - "Hong Kong"
    - "HK"
  block:
    - "United States"
    - "USA"
    - "United Kingdom"
    - "London"
    - "Germany"
    - "France"
    - "India"
    - "Bengaluru"
    - "Brazil"
    - "Australia"
    - "Singapore"
    - "Remote"
    - "APAC"
    - "Asia"
  block_hard:
    - "United States"
    - "United Kingdom"
    - "India"
    - "Europe"
    - "Singapore"
    - "Remote"

# Matching only. Never print salary on a CV.
# Replace both placeholders with your own annual HKD numbers before scanning.
# They are not anyone's personal compensation claim.
salary_filter:
  min: YOUR_FLOOR_HKD_YEAR
  max: 0
  currency: "HKD"
  target: YOUR_TARGET_HKD_YEAR

max_posting_age_days: 45

title_filter:
  skip_tiers: [intern, entry]
  positive:
    # Primary — AI transformation / solutions / delivery
    - "AI Transformation"
    - "Artificial Intelligence Transformation"
    - "Digital Transformation"
    - "Transformation Lead"
    - "Transformation Manager"
    - "Solutions Architect"
    - "Solutions Consultant"
    - "Solutions Delivery"
    - "Delivery Lead"
    - "Delivery Manager"
    - "Programme Delivery"
    - "Program Delivery"
    - "Customer AI"
    - "GenAI"
    - "word:AI"
    - "Associate Director"
    - "Senior Manager"
    # Secondary — MarTech / measurement / analytics (still in scope)
    - "Marketing Analytics"
    - "Marketing Science"
    - "Measurement"
    - "MarTech"
    - "Martech"
    - "Marketing Technology"
    - "Customer Analytics"
    - "Customer Value"
    - "CVM"
    - "CDP"
    - "Tealium"
    - "Tagging"
    - "MMM"
    - "Mix Modelling"
    - "Mix Modeling"
    - "Meridian"
    - "Data Analytics"
    - "Analytics Lead"
    - "Analytics Manager"
  negative:
    - "word:Intern"
    - "word:Interns"
    - "Internship"
    - "Graduate"
    - "Junior"
    - "Media Planner"
    - "Media Planning"
    - "word:CFO"
    - "Accountant"
    - "Bookkeeper"

# LinkedIn: paste URL into inbox. eFinancialCareers: secondary paste-only (demoted from primary).
# eCareer HK (CSB Government Vacancies): paste-only — see job_boards seed entry (enabled: false).
# LinkedIn later: OpenCLI on an agent-only account — never the main profile.

tracked_companies:
